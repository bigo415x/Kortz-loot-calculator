<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<title>Kortz Center Loot Calculator</title>
<style>

  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
         font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  input[type=range] { accent-color:var(--accent); height:22px; }
  input[type=checkbox],input[type=radio] { accent-color:var(--accent); width:17px; height:17px; }
  select { appearance:none; -webkit-appearance:none; }
  button { font-family:inherit; }
  .app { max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
  .head { position:sticky; top:0; z-index:10; background:var(--card); padding:10px 14px;
          padding-top:calc(10px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:6px;
          border-bottom:1px solid var(--line); }
  .row-between { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .title { font-weight:500; font-size:16px; letter-spacing:-0.01em; }
  .reset { flex:none; min-height:36px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
           background:transparent; color:var(--text); font-size:12px; cursor:pointer; }
  .players-label { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  select.players, select.item { color:var(--text); background:var(--bg); border:1px solid var(--line); }
  select.players { flex:1; min-height:38px; padding:4px 10px; font-size:13px; border-radius:8px; }
  .tabs { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tab { flex:1; min-height:40px; padding:6px 10px; font-size:13px; border:none; cursor:pointer;
         background:transparent; color:var(--text); }
  .tab.right { border-left:1px solid var(--line); }
  .tab.active { background:var(--bg); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .body { flex:1; padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .hint { font-size:11px; color:var(--muted2); }
  .card { background:var(--card); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .sec-toggle { all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; min-height:34px; }
  .sec-label { font-weight:500; font-size:14px; }
  .sec-chevron { font-size:11px; color:var(--muted2); }
  .sec-note { font-size:11px; color:var(--muted2); }
  .subgroup { display:flex; flex-direction:column; gap:4px; background:rgba(233,233,237,0.04); border-radius:6px; padding:2px 8px; }
  .sub-toggle { all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; min-height:32px; }
  .sub-label { font-size:12.5px; font-weight:500; color:rgba(233,233,237,0.85); }
  .placement { display:flex; flex-direction:column; gap:6px; padding:6px 0; border-bottom:1px solid var(--line-soft); }
  .placement:last-child { border-bottom:none; }
  .pl-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pl-title { font-size:12.5px; font-weight:500; }
  .pl-pct { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent); margin-left:6px; }
  .pl-check { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); min-height:30px; cursor:pointer; flex:none; }
  .pl-remove { all:unset; cursor:pointer; font-size:11px; color:var(--muted2); min-height:30px; padding:0 4px; }
  select.item { width:100%; min-height:40px; padding:4px 8px; font-size:12.5px; border-radius:7px; }
  .slider-row { display:flex; align-items:center; gap:7px; min-height:38px; }
  .slider-row input[type=range] { flex:1; min-width:0; }
  .slider-val { flex:none; width:60px; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .step-btn { flex:none; width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
              background:rgba(233,233,237,0.06); color:var(--text); font-size:17px; line-height:1;
              cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; padding:0; }
  .step-btn:active { background:var(--accent); color:#161826; }
  .buyer-label { display:flex; align-items:center; gap:6px; font-size:11.5px; color:rgba(233,233,237,0.75); min-height:28px; cursor:pointer; }
  .add-deposit { all:unset; cursor:pointer; font-size:12px; color:var(--accent); min-height:32px; }
  .note-box { font-size:11px; line-height:1.4; color:var(--muted); background:var(--card); border-radius:8px; padding:8px 10px; }
  .p-head { display:flex; align-items:center; justify-content:space-between; }
  .p-name { font-weight:500; font-size:15px; }
  .p-meta { font-size:11.5px; color:var(--muted); }
  .p-sub { font-size:11px; color:var(--accent); margin-top:-2px; }
  .bar { height:7px; border-radius:4px; background:var(--bg); overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); border-radius:4px; }
  .res-row { display:flex; flex-direction:column; padding:4px 0; border-bottom:1px solid var(--line-soft); }
  .res-line { display:flex; justify-content:space-between; font-size:12.5px; }
  .res-sub { font-size:10.5px; color:var(--muted2); }

  .bag-total-label { font-size:11.5px; color:var(--muted); }

  .bonus-box { font-size:12px; color:#d2cefd; background:#2b2741; border-radius:8px; padding:8px 10px; }
  .grand { background:#262a60; border-radius:8px; padding:12px; display:flex; justify-content:space-between; align-items:center; }
  .grand-label { font-size:12.5px; }
  .grand-val { font-weight:600; font-size:20px; color:#f5f4ff; }

  .footer { text-align:center; font-size:10px; color:var(--muted2); padding:14px 12px 20px; }

<div class="app">

      <div class="title">Kortz Center Loot Calculator</div>

    </div>

const KIND_TO_CATEGORY = { case: 'small_glass_case', tall: 'tall_glass_case', painting: 'painting', crate: 'truck_crate' };
const KIND_TO_LOOT_TYPE = { case: 'Small Glass Case', tall: 'Tall Glass Case', painting: 'Painting', crate: 'Truck Crate', depositbox: 'Deposit Box' };
const MAX_BUYER_REQUESTS = 3;
const BUYER_REQUEST_BONUS = 50000;

// Floor 3 and Crisp Gallery are physically adjacent and treated as one assignable "space".
// Vault and Garage are passed through by everyone, so they're not assignable - any player can draw from them.
const CLUSTER_OF_SECTION = { f1: 'f1', f2: 'f2', f3: 'f3crisp', crisp: 'f3crisp', vault: null, garage: null };
const CLUSTER_LABEL = { f1: 'Floor 1', f2: 'Floor 2', f3crisp: 'Floor 3 / Crisp Gallery' };
const ASSIGNABLE_CLUSTERS = ['f1', 'f2', 'f3crisp'];
const KIND_PROXIMITY_ORDER = { painting: 0, tall: 1, case: 2, crate: 3, depositbox: 4 };

/* ---------------- Helpers ---------------- */
function getCategory(id) { return LOOT_DATA.categories.find(c => c.categoryId === id); }
function findItem(categoryId, itemName) { return getCategory(categoryId).items.find(it => it.itemName === itemName); }
function groupByType(items) {
  const order = []; const map = {};
  items.forEach(it => { if (!map[it.itemType]) { map[it.itemType] = []; order.push(it.itemType); } map[it.itemType].push(it); });
  return order.map(t => ({ itemType: t, items: map[t] }));
}
function groupPlacementsByKind(placements) {
  const order = []; const map = {};
  placements.forEach(pl => { if (!map[pl.kind]) { map[pl.kind] = []; order.push(pl.kind); } map[pl.kind].push(pl); });
  return order.map(k => ({ kind: k, placements: map[k] }));
}
const KIND_GROUP_LABEL = { case: 'Small Cases', tall: 'Tall Cases', painting: 'Paintings', crate: 'Truck Crate', depositbox: 'Deposit Boxes' };
function itemMid(item) {
  const step = item.valueIncrement || 500;
  const raw = (item.valueMin + item.valueMax) / 2;
  const snapped = item.valueMin + Math.round((raw - item.valueMin) / step) * step;
  return Math.min(item.valueMax, Math.max(item.valueMin, snapped));
}
function fmtK(v) { const k = v / 1000; return Number.isInteger(k) ? String(k) : k.toFixed(1); }
function itemDisplayLabel(item) {
  const nameLower = item.itemName.toLowerCase();
  const typeLower = item.itemType.toLowerCase();
  if (nameLower.includes(typeLower)) return item.itemName;
  return `${item.itemType} — ${item.itemName}`;
}
function kindTitle(kind, idx) {
  if (kind === 'case') return `Small Case ${idx + 1}`;
  if (kind === 'tall') return `Tall Case ${idx + 1}`;
  if (kind === 'painting') return `Painting ${idx + 1}`;
  if (kind === 'depositbox') return `Deposit Box ${idx + 1}`;
  return `Crate`;
}
// Floor 2's paintings sit in two distinct clusters of three, so label them that way
// rather than as a flat run of six.
function placementTitle(sec, pl) {
  if (sec.id === 'f2' && pl.kind === 'painting') return `Area ${pl.idx < 3 ? 1 : 2} - Painting ${(pl.idx % 3) + 1}`;
  return kindTitle(pl.kind, pl.idx);
}
function mk(prefix, kind, count) {
  return Array.from({ length: Math.max(0, count) }, (_, i) => ({ id: `${prefix}_${kind}_${i}`, kind, idx: i }));
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* 0/1 knapsack over 5% weight buckets */
function knapsack(items, capacityPct) {
  const capUnits = Math.max(0, Math.round(capacityPct / 5));
  const n = items.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(capUnits + 1).fill(0));
  for (let i = 1; i <= n; i++) {
    const w = Math.round(items[i - 1].pct / 5);
    const v = items[i - 1].value;
    for (let c = 0; c <= capUnits; c++) {
      dp[i][c] = dp[i - 1][c];
      if (w <= c && dp[i - 1][c - w] + v > dp[i][c]) dp[i][c] = dp[i - 1][c - w] + v;
    }
  }
  let c = capUnits;
  const chosen = [];
  for (let i = n; i >= 1; i--) {
    if (dp[i][c] !== dp[i - 1][c]) { chosen.push(items[i - 1]); c -= Math.round(items[i - 1].pct / 5); }
  }
  const totalPct = chosen.reduce((s, it) => s + it.pct, 0);
  return { items: chosen, value: dp[n][capUnits], pct: totalPct };
}

// Ties in the knapsack favor whichever item comes first in the input array, so pre-sorting
// by kind clusters same-kind picks together (proximity) without changing the max value found.
function groupSortForProximity(items) {
  return items.slice().sort((a, b) => {
    const ka = KIND_PROXIMITY_ORDER[a.kind] ?? 9, kb = KIND_PROXIMITY_ORDER[b.kind] ?? 9;
    if (ka !== kb) return ka - kb;
    return b.value - a.value;
  });
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable, ignore */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
    // migrate old buyerRequests shape ([{itemId,player}]) to the new plain-id array
    if (Array.isArray(state.buyerRequests)) {
      state.buyerRequests = state.buyerRequests.map(br => (typeof br === 'string' ? br : br && br.itemId)).filter(Boolean);
    }
  } catch (e) { /* corrupt or unavailable, start fresh */ }
}

  depositBoxes: null, // array of values, or null => default
  collapsed: {},      // sectionId -> bool
  buyerRequests: [],  // [itemId, ...] - heist-wide, auto-fulfilled by whichever player has room
};

const DEFAULTS = {
  floor1SmallCases: 2, floor1TallCases: 1,
  floor2Paintings: 6, floor2SmallCases: 6,
  floor3Paintings: 2, floor3SmallCases: 2, floor3TallCases: 2,
  crispGalleryPaintings: 2, crispGallerySmallCases: 3, crispGalleryTallCases: 2,
  vaultPaintings: 4, vaultDepositBoxes: 1,
};

function getSections() {
  const p = DEFAULTS;
  return [
    { id: 'vault', label: 'Vault', crew: false, note: 'Deposit boxes are low value — usually skip unless space is spare', placements: mk('vault', 'painting', p.vaultPaintings) },
    { id: 'garage', label: 'Garage', crew: false, placements: mk('garage', 'crate', 1) },
    { id: 'f1', label: 'Floor 1', crew: false, placements: [...mk('f1', 'case', p.floor1SmallCases), ...mk('f1', 'tall', p.floor1TallCases)] },
    { id: 'f2', label: 'Floor 2', crew: false, placements: [...mk('f2', 'painting', p.floor2Paintings), ...mk('f2', 'case', p.floor2SmallCases)] },
    { id: 'f3', label: 'Floor 3', crew: false, note: 'Tall cases require Glass Cutter prep', placements: [...mk('f3', 'painting', p.floor3Paintings), ...mk('f3', 'case', p.floor3SmallCases), ...mk('f3', 'tall', p.floor3TallCases)] },
    { id: 'crisp', label: 'Crisp Gallery — 3rd floor (needs 2+ players)', crew: true, placements: [...mk('crisp', 'painting', p.crispGalleryPaintings), ...mk('crisp', 'case', p.crispGallerySmallCases), ...mk('crisp', 'tall', p.crispGalleryTallCases)] },
  ];
}

function getDepositBoxes() {
  return state.depositBoxes || Array.from({ length: DEFAULTS.vaultDepositBoxes }, () => 7500);
}

// Paintings spawn in consistent spots run to run, so these placements pre-select the painting
// that's actually there instead of making you pick it from a 14-item list every time.
const PLACEMENT_DEFAULT_ITEMS = {
  vault_painting_0: 'With Friends Like These',
  vault_painting_1: 'Het Gouden Hondje',
  vault_painting_2: 'Swingset Study No. LXIX',
  vault_painting_3: 'The Hunter Becomes the Hunted',
  f2_painting_0: 'The Chief',
  f2_painting_1: 'Orange Crush',
  f2_painting_2: 'Canis Hominem Edit',
  f2_painting_3: 'La Duchesse',
  f2_painting_4: 'Do You See Me',
  f2_painting_5: 'Explain Yourself',
  f3_painting_0: 'Sod Off',
  f3_painting_1: 'Cooked',
  crisp_painting_0: 'The Great Circle Back',
  crisp_painting_1: "Don't Forgo These Blueprints",
};

function computeDefaultItemKeys() {
  const counters = {}; const map = {};
  getSections().forEach(sec => sec.placements.forEach(pl => {
    if (pl.kind === 'crate') return;
    const categoryId = KIND_TO_CATEGORY[pl.kind];
    const items = getCategory(categoryId).items;
    const known = PLACEMENT_DEFAULT_ITEMS[pl.id];
    if (known && items.some(it => it.itemName === known)) { map[pl.id] = known; return; }
    const idx = (counters[categoryId] || 0) % items.length;
    counters[categoryId] = (counters[categoryId] || 0) + 1;
    map[pl.id] = items[idx].itemName;
  }));
  return map;
}

function buildPool() {
  const pool = [];
  const defaultItemKeys = computeDefaultItemKeys();
  getDepositBoxes().forEach((val, idx) => {
    const dbId = `vault_depositbox_${idx}`;
    const dbSlot = state.slots[dbId];
    if (dbSlot && dbSlot.empty) return;
    pool.push({ id: dbId, pct: 5, value: val, categoryLabel: 'Deposit Box', lootType: 'Deposit Box', locationLabel: 'Vault', cluster: null, isCrisp: false, kind: 'depositbox' });
  });
  getSections().forEach(sec => {
    if (sec.crew && state.playerCount < 2) return;
    const cluster = CLUSTER_OF_SECTION[sec.id];
    const isCrisp = sec.id === 'crisp';
    sec.placements.forEach(pl => {
      const categoryId = KIND_TO_CATEGORY[pl.kind];
      if (pl.kind === 'crate') {
        const item = getCategory(categoryId).items[0];
        const defaultVal = item.valueMin;
        const slot = state.slots[pl.id] || { value: defaultVal };
        if (slot.skip) return;
        pool.push({ id: pl.id, pct: item.bagWeightPercent, value: slot.value !== undefined ? slot.value : defaultVal, categoryLabel: itemDisplayLabel(item), lootType: KIND_TO_LOOT_TYPE[pl.kind], locationLabel: sec.label, cluster, isCrisp, kind: pl.kind });
      } else {
        const slot = state.slots[pl.id] || {};
        if (slot.empty) return;
        const itemKey = slot.itemKey || defaultItemKeys[pl.id];
        const item = findItem(categoryId, itemKey);
        const value = slot.value !== undefined ? slot.value : itemMid(item);
        pool.push({ id: pl.id, pct: item.bagWeightPercent, value, categoryLabel: itemDisplayLabel(item), lootType: KIND_TO_LOOT_TYPE[pl.kind], locationLabel: sec.label, cluster, isCrisp, kind: pl.kind });
      }
    });
  });
  return pool;
}

// Buyer's Requests are heist-wide, not tied to a specific player: force each flagged item into
// whichever eligible player currently has the most spare capacity. A player barred from Crisp
// (see hackerIdx below) can never be forced to hold a Crisp item.
function forceAssignBuyerRequests(validRequests, playerCount, hackerIdx) {
  const lockedByPlayer = Array.from({ length: playerCount }, () => []);
  const loadPct = new Array(playerCount).fill(0);
  let fulfilledCount = 0;
  validRequests.forEach(item => {
    const eligible = [];
    for (let i = 0; i < playerCount; i++) {
      if (item.isCrisp && (hackerIdx === null || i === hackerIdx)) continue;
      if (loadPct[i] + item.pct > 100) continue;
      eligible.push(i);
    }
    if (!eligible.length) return; // unreachable under this plan - left unfulfilled, scored accordingly
    const target = eligible.reduce((b, i) => (loadPct[i] < loadPct[b] ? i : b), eligible[0]);
    lockedByPlayer[target].push(item);
    loadPct[target] += item.pct;
    fulfilledCount++;
  });
  return { lockedByPlayer, fulfilledCount };
}

// Evaluates one candidate crew plan: a cluster (home floor) per player, plus who (if anyone) is
// the Crisp Gallery "Hacker" - excluded from every Crisp item, everywhere, in exchange for letting
// the crew access Crisp Gallery at all. hackerIdx === null means nobody hacks, so no one gets Crisp loot.
function evaluatePlan(pool, playerCount, clusterAssign, hackerIdx, validRequests) {
  const { lockedByPlayer, fulfilledCount } = forceAssignBuyerRequests(validRequests, playerCount, hackerIdx);
  const claimedIds = new Set();
  lockedByPlayer.forEach(items => items.forEach(it => claimedIds.add(it.id)));

  const players = [];
  for (let i = 0; i < playerCount; i++) {
    const cluster = clusterAssign[i];
    const locked = lockedByPlayer[i];
    const lockedPct = locked.reduce((s, it) => s + it.pct, 0);
    const lockedValue = locked.reduce((s, it) => s + it.value, 0);
    const capacity = Math.max(0, 100 - lockedPct);
    const crispBlocked = it => it.isCrisp && (hackerIdx === null || i === hackerIdx);

    // A single knapsack over the FULL available pool for the FULL capacity guarantees true
    // value-maximality - the actual goal. Home-floor items are just sorted first so ties in the
    // DP favor staying local (proximity), but a genuinely higher-value item elsewhere always wins;
    // small home-floor items never get to "lock in" capacity before a bigger outside item competes.
    const available = pool.filter(it => !claimedIds.has(it.id) && !crispBlocked(it));
    const primary = groupSortForProximity(available.filter(it => it.cluster === cluster));
    const outside = groupSortForProximity(available.filter(it => it.cluster !== cluster));
    const solved = knapsack([...primary, ...outside], capacity);
    solved.items.forEach(it => claimedIds.add(it.id));
    const spillPct = solved.items.filter(it => it.cluster !== cluster).reduce((s, it) => s + it.pct, 0);

    players.push({ num: i + 1, cluster, isHacker: i === hackerIdx, lockedItems: locked, fillItems: solved.items, value: solved.value + lockedValue, pctUsed: solved.pct + lockedPct, spillPct });
  }
  const bonusActive = fulfilledCount === MAX_BUYER_REQUESTS && validRequests.length === MAX_BUYER_REQUESTS;
  const totalValue = players.reduce((s, p) => s + p.value, 0) + (bonusActive ? BUYER_REQUEST_BONUS : 0);
  const totalSpillPct = players.reduce((s, p) => s + p.spillPct, 0);
  return { players, bonusActive, fulfilledCount, totalValue, totalSpillPct };
}

// Solo has no floor assignment or Hacker concept (Crisp Gallery isn't accessible at 1 player anyway) -
// route it through evaluatePlan too (cluster null matches only Vault/Garage as "primary", everything
// else is "outside", combined into the same single value-maximizing knapsack pass).
function computeCrewPlan(pool, playerCount, buyerRequestIds) {
  const validRequests = buyerRequestIds.map(id => pool.find(it => it.id === id)).filter(Boolean);

  if (playerCount <= 1) {
    return evaluatePlan(pool, 1, [null], null, validRequests);
  }

  // Brute-force every floor assignment x Hacker choice (small search space, instant) and keep the
  // best plan, in strict priority order:
  //  1. Fulfill as many Buyer's Requests as physically possible - always takes priority.
  //  2. Maximize total crew value.
  //  3. Least total spillover (proximity - stay on your own floor when it ties on value).
  let best = null;
  const hackerCandidates = [null, ...Array.from({ length: playerCount }, (_, i) => i)];
  (function tryAssignments(prefix) {
    if (prefix.length === playerCount) {
      hackerCandidates.forEach(hackerIdx => {
        // The Hacker avoids being home-assigned to Floor 3/Crisp when possible - they're stuck at
        // the door, so Floor 3 items should only ever reach them as a genuine last-resort spillover.
        if (hackerIdx !== null && prefix[hackerIdx] === 'f3crisp') return;
        const result = evaluatePlan(pool, playerCount, prefix, hackerIdx, validRequests);
        const better = !best
          || result.fulfilledCount > best.fulfilledCount
          || (result.fulfilledCount === best.fulfilledCount && result.totalValue > best.totalValue)
          || (result.fulfilledCount === best.fulfilledCount && result.totalValue === best.totalValue && result.totalSpillPct < best.totalSpillPct);
        if (better) best = result;
      });
      return;
    }
    ASSIGNABLE_CLUSTERS.forEach(c => tryAssignments([...prefix, c]));
  })([]);

  return best;
}

/* ---------------- Mutations ---------------- */
function setTab(t) { state.tab = t; saveState(); render(); }
function setPlayerCount(n) { state.playerCount = n; saveState(); render(); }
function resetAll() { state.slots = {}; state.depositBoxes = null; state.buyerRequests = []; saveState(); render(); }
function toggleCollapse(id) { state.collapsed[id] = !state.collapsed[id]; saveState(); render(); }
function toggleEmpty(id) { const cur = state.slots[id] || {}; state.slots[id] = { ...cur, empty: !cur.empty }; saveState(); render(); }
function toggleSkip(id) { const cur = state.slots[id] || {}; state.slots[id] = { ...cur, skip: !cur.skip }; saveState(); render(); }
function setItemKey(id, categoryId, itemName) {
  const item = findItem(categoryId, itemName); const cur = state.slots[id] || {};
  state.slots[id] = { ...cur, empty: false, itemKey: itemName, value: itemMid(item) }; saveState(); render();
}
function setValue(id, val) { const cur = state.slots[id] || {}; state.slots[id] = { ...cur, value: val }; saveState(); }
function addDepositBox() { const arr = getDepositBoxes(); state.depositBoxes = [...arr, 7500]; saveState(); render(); }
function removeDepositBox(idx) {
  const arr = getDepositBoxes();
  // Deposit box slots are keyed by index, so removing one has to shift every later box's
  // Empty flag down with it or the flags land on the wrong boxes.
  const flags = arr.map((_, i) => !!(state.slots[`vault_depositbox_${i}`] || {}).empty).filter((_, i) => i !== idx);
  arr.forEach((_, i) => { delete state.slots[`vault_depositbox_${i}`]; });
  flags.forEach((isEmpty, i) => { if (isEmpty) state.slots[`vault_depositbox_${i}`] = { empty: true }; });
  state.depositBoxes = arr.filter((_, i) => i !== idx);
  saveState(); render();
}
function setDepositBoxValue(idx, val) { const arr = getDepositBoxes().slice(); arr[idx] = val; state.depositBoxes = arr; saveState(); }
function toggleBuyerRequest(id) {
  const exists = state.buyerRequests.includes(id);
  if (exists) { state.buyerRequests = state.buyerRequests.filter(x => x !== id); saveState(); render(); return; }
  if (state.buyerRequests.length >= MAX_BUYER_REQUESTS) return;
  state.buyerRequests = [...state.buyerRequests, id]; saveState(); render();
}

/* ---------------- Render ---------------- */
const bodyEl = document.getElementById('body');

function render() {
  const pool = buildPool();
  const poolTotalValue = pool.reduce((s, it) => s + it.value, 0);

  // header tab labels / active states
  document.getElementById('tabItems').textContent = `Loot Available - ${pool.length}`;
  document.getElementById('playerSelect').value = String(state.playerCount);
  document.getElementById('tabItems').classList.toggle('active', state.tab === 'items');
  document.getElementById('tabResults').classList.toggle('active', state.tab === 'results');

  if (state.tab === 'items') {
    bodyEl.innerHTML = renderItemsTab(pool, poolTotalValue);
  } else {
    bodyEl.innerHTML = renderResultsTab(pool);
  }
  attachListeners();
}

function renderItemsTab(pool, poolTotalValue) {
  const defaultItemKeys = computeDefaultItemKeys();
  const depositBoxes = getDepositBoxes();
  let html = `<div class="hint">${pool.length} items in play - $${fmtK(poolTotalValue)}k total pool value</div>`;

  getSections().filter(sec => !sec.crew || state.playerCount >= 2).forEach(sec => {
    const collapsed = !!state.collapsed[sec.id];
    html += `<div class="card"><button class="sec-toggle" data-act="collapse" data-id="${sec.id}">
      <span class="sec-label">${esc(sec.label)}</span>
      <span class="sec-chevron">${collapsed ? '▸ show' : '▾ hide'}</span></button>`;
    if (!collapsed) {
      if (sec.note) html += `<div class="sec-note">${esc(sec.note)}</div>`;
      const kindGroups = groupPlacementsByKind(sec.placements);
      const isVault = sec.id === 'vault';
      const nestByKind = kindGroups.length > 1 || isVault;

      if (nestByKind) {
        kindGroups.forEach(g => {
          const subId = `${sec.id}::${g.kind}`;
          const subCollapsed = !!state.collapsed[subId];
          html += `<div class="subgroup"><button class="sub-toggle" data-act="collapse" data-id="${subId}">
            <span class="sub-label">${esc(KIND_GROUP_LABEL[g.kind])} (${g.placements.length})</span>
            <span class="sec-chevron">${subCollapsed ? '▸ show' : '▾ hide'}</span></button>`;
          if (!subCollapsed) { g.placements.forEach(pl => { html += renderPlacement(pl, sec, defaultItemKeys); }); }
          html += `</div>`;
        });
        if (isVault) {
          const subId = `${sec.id}::depositbox`;
          const subCollapsed = !!state.collapsed[subId];
          html += `<div class="subgroup"><button class="sub-toggle" data-act="collapse" data-id="${subId}">
            <span class="sub-label">${esc(KIND_GROUP_LABEL.depositbox)} (${depositBoxes.length})</span>
            <span class="sec-chevron">${subCollapsed ? '▸ show' : '▾ hide'}</span></button>`;
          if (!subCollapsed) {
            depositBoxes.forEach((val, idx) => { html += renderDepositBox(idx, val, depositBoxes.length > 1); });
            html += `<button class="add-deposit" data-act="add-deposit">+ Add deposit box</button>`;
          }
          html += `</div>`;
        }
      } else {
        sec.placements.forEach(pl => { html += renderPlacement(pl, sec, defaultItemKeys); });
      }
    }
    html += `</div>`;
  });
  return html;
}

function renderPlacement(pl, sec, defaultItemKeys) {
  const categoryId = KIND_TO_CATEGORY[pl.kind];
  const title = placementTitle(sec, pl);

  if (pl.kind === 'crate') {
    const item = getCategory(categoryId).items[0];
    const slot = state.slots[pl.id] || {};
    const skip = !!slot.skip;
    const value = slot.value !== undefined ? slot.value : item.valueMin;
    let h = `<div class="placement"><div class="pl-head">
      <div class="pl-title">${esc(title)}<span class="pl-pct">${item.bagWeightPercent}% bag</span></div>
      <label class="pl-check"><input type="checkbox" data-act="skip" data-id="${pl.id}" ${skip ? 'checked' : ''}/>Skip</label></div>`;
    if (!skip) {
      h += sliderRow(pl.id, item.valueMin, item.valueMax, item.valueIncrement || 5000, value);
    }
    return h + `</div>`;
  }

  const slot = state.slots[pl.id] || {};
  const empty = !!slot.empty;
  const cat = getCategory(categoryId);
  const itemKey = slot.itemKey || defaultItemKeys[pl.id];
  const item = findItem(categoryId, itemKey);
  const value = slot.value !== undefined ? slot.value : itemMid(item);

  const isBuyerRequest = state.buyerRequests.includes(pl.id);
  const buyerFull = state.buyerRequests.length >= MAX_BUYER_REQUESTS && !isBuyerRequest;

  let h = `<div class="placement"><div class="pl-head">
    <div class="pl-title">${esc(title)}<span class="pl-pct">${item.bagWeightPercent}% bag</span></div>
    <label class="pl-check"><input type="checkbox" data-act="empty" data-id="${pl.id}" ${empty ? 'checked' : ''}/>Empty</label></div>`;

  if (!empty) {
    // item select with optgroups
    let opts = '';
    groupByType(cat.items).forEach(g => {
      opts += `<optgroup label="${esc(g.itemType)}">`;
      g.items.forEach(it => {
        const sel = it.itemName === itemKey ? 'selected' : '';
        opts += `<option value="${esc(it.itemName)}" ${sel}>${esc(itemDisplayLabel(it))} — ${it.bagWeightPercent}%</option>`;
      });
      opts += `</optgroup>`;
    });
    h += `<select class="item" data-act="item" data-id="${pl.id}" data-cat="${categoryId}">${opts}</select>`;
    h += sliderRow(pl.id, item.valueMin, item.valueMax, item.valueIncrement || 500, value);

    // buyer's request (heist-wide - the crew auto-decides who ends up carrying it)
    h += `<label class="buyer-label" style="opacity:${buyerFull ? 0.4 : 1}">
      <input type="checkbox" data-act="buyer" data-id="${pl.id}" ${isBuyerRequest ? 'checked' : ''}/>Buyer's Request</label>`;
  }
  return h + `</div>`;
}

function renderDepositBox(idx, val, showRemove) {
  const id = `vault_depositbox_${idx}`;
  const empty = !!(state.slots[id] && state.slots[id].empty);
  let h = `<div class="placement"><div class="pl-head">
    <div class="pl-title">Deposit Box ${idx + 1}<span class="pl-pct">5% bag</span></div>
    <div style="display:flex;align-items:center;gap:6px">
      <label class="pl-check"><input type="checkbox" data-act="empty" data-id="${id}" ${empty ? 'checked' : ''}/>Empty</label>`;
  if (showRemove) h += `<button class="pl-remove" data-act="remove-deposit" data-idx="${idx}">Remove</button>`;
  h += `</div></div>`;
  if (!empty) h += sliderRow(id, 5000, 12500, 500, val, true);
  return h + `</div>`;
}

function sliderRow(id, min, max, step, value, isDeposit) {
  const idxAttr = isDeposit ? `data-idx="${id.replace('vault_depositbox_', '')}"` : '';
  return `<div class="slider-row">
    <button class="step-btn" data-act="step" data-dir="-1" data-target="${esc(id)}" aria-label="Decrease">&minus;</button>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value}"
      data-act="${isDeposit ? 'deposit-slide' : 'slide'}" data-id="${esc(id)}" ${idxAttr}/>
    <button class="step-btn" data-act="step" data-dir="1" data-target="${esc(id)}" aria-label="Increase">+</button>
    <div class="slider-val" data-valfor="${esc(id)}">$${fmtK(value)}k</div></div>`;
}

// Nudges the range input and replays a normal input event so the existing slide handlers
// (state write, label update, live pool total) all run unchanged.
function stepSlider(targetId, dir) {
  const input = bodyEl.querySelector(`input[type=range][data-id="${CSS.escape(targetId)}"]`);
  if (!input) return;
  const step = parseFloat(input.step) || 1;
  const min = parseFloat(input.min), max = parseFloat(input.max);
  const next = Math.min(max, Math.max(min, parseFloat(input.value) + dir * step));
  if (next === parseFloat(input.value)) return;
  input.value = next;
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

function renderResultsTab(pool) {
  const { players, bonusActive, totalValue } = computeCrewPlan(pool, state.playerCount, state.buyerRequests);
  let html = '';
  if (state.playerCount > 1) {
    html += `<div class="note-box">Each player is auto-assigned one home floor (Floor 3 and Crisp Gallery count as one space) to cut down on backtracking, topping off from elsewhere only once their floor runs dry. Crisp Gallery needs someone to hold the door - that player gets none of its loot, chosen automatically for best total value.</div>`;
  }
  html += `<div class="hint">${state.buyerRequests.length}/3 Buyer's Requests selected (marked with * below) - auto-fulfilled by whichever player has room</div>`;
  html += `<div class="hint">Picks maximize total cash, not item count or headline price - bag space is the real currency. Paintings look big but cost 50% of a bag, so they lose to smaller loot with a higher per-1% return (shown under each row).</div>`;

  players.forEach(p => {
    const rows = [
      ...p.lockedItems.map(it => ({ ...it, isLocked: true })),
      ...p.fillItems.map(it => ({ ...it, isLocked: false })),
    ];
    const clusterLabel = p.cluster ? CLUSTER_LABEL[p.cluster] : '';
    const hackerNote = p.isHacker ? 'Crisp Gallery Hacker - no Crisp loot' : '';
    const subLine = [clusterLabel, hackerNote].filter(Boolean).join(' - ');

    html += `<div class="card">
      <div class="p-head"><div class="p-name">Player ${p.num}</div>
        <div class="p-meta">${p.pctUsed}% used - ${100 - p.pctUsed}% left</div></div>`;
    if (subLine) html += `<div class="p-sub">${esc(subLine)}</div>`;
    html += `<div class="bar"><div class="bar-fill" style="width:${Math.min(100, p.pctUsed)}%"></div></div>
      <div style="display:flex;flex-direction:column">`;
    if (rows.length) {
      rows.forEach(it => {
        const color = it.isLocked ? '#d2cefd' : 'var(--text)';
        html += `<div class="res-row">
          <div class="res-line" style="color:${color}">
            <span>${esc(it.categoryLabel)}${it.isLocked ? ' *' : ''}</span>
            <span style="font-variant-numeric:tabular-nums">$${fmtK(it.value)}k - ${it.pct}%</span></div>
          <div class="res-sub">${esc(it.locationLabel)} &middot; ${esc(it.lootType)} &middot; $${fmtK(Math.round(it.value / it.pct))}k per 1% bag</div></div>`;
      });
    } else {
      html += `<div class="empty-msg">Enter scouted items on the Loot Available tab to see a suggested fill.</div>`;
    }
    html += `</div><div class="bag-total"><span class="bag-total-label">Bag total</span>
      <span class="bag-total-val">$${fmtK(p.value)}k</span></div></div>`;
  });

  if (bonusActive) {
    html += `<div class="bonus-box">All 3 Buyer's Requests fulfilled - +$50k bonus payout included below</div>`;
  }
  html += `<div class="grand"><span class="grand-label">Total payout</span>
    <span class="grand-val">$${fmtK(totalValue)}k</span></div>`;
  return html;
}

/* ---------------- Event wiring ---------------- */
function updatePoolTotalLive() {
  const pool = buildPool();
  const total = pool.reduce((s, it) => s + it.value, 0);
  const hint = bodyEl.querySelector('.hint');
  if (hint) hint.textContent = `${pool.length} items in play - $${fmtK(total)}k total pool value`;
}

function attachListeners() {
  bodyEl.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;
    const id = el.dataset.id;
    if (act === 'collapse') el.addEventListener('click', () => toggleCollapse(id));
    else if (act === 'skip') el.addEventListener('change', () => toggleSkip(id));
    else if (act === 'empty') el.addEventListener('change', () => toggleEmpty(id));
    else if (act === 'item') el.addEventListener('change', e => setItemKey(id, el.dataset.cat, e.target.value));
    else if (act === 'buyer') el.addEventListener('change', () => toggleBuyerRequest(id));
    else if (act === 'step') el.addEventListener('click', () => stepSlider(el.dataset.target, parseInt(el.dataset.dir, 10)));
    else if (act === 'add-deposit') el.addEventListener('click', addDepositBox);
    else if (act === 'remove-deposit') el.addEventListener('click', () => removeDepositBox(parseInt(el.dataset.idx, 10)));
    else if (act === 'slide') {
      el.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        setValue(id, v);
        const lab = bodyEl.querySelector(`[data-valfor="${CSS.escape(id)}"]`);
        if (lab) lab.textContent = `$${fmtK(v)}k`;
        updatePoolTotalLive();
      });
    } else if (act === 'deposit-slide') {
      el.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        setDepositBoxValue(parseInt(el.dataset.idx, 10), v);
        const lab = bodyEl.querySelector(`[data-valfor="${CSS.escape(id)}"]`);
        if (lab) lab.textContent = `$${fmtK(v)}k`;
        updatePoolTotalLive();
      });
    }
  });
}

document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('playerSelect').addEventListener('change', e => setPlayerCount(parseInt(e.target.value, 10)));
document.getElementById('tabItems').addEventListener('click', () => setTab('items'));
document.getElementById('tabResults').addEventListener('click', () => setTab('results'));

loadState();
render();
</script>
</body>
</html>
