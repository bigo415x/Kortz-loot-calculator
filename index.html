<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<title>Kortz Center Loot Calculator</title>
<style>
  :root { --bg:#161826; --card:#232532; --line:rgba(233,233,237,0.16); --line-soft:rgba(233,233,237,0.08);
          --text:#e9e9ed; --muted:rgba(233,233,237,0.6); --muted2:rgba(233,233,237,0.5); --accent:#9184d9; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
         font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  input[type=range] { accent-color:var(--accent); height:22px; }
  input[type=checkbox],input[type=radio] { accent-color:var(--accent); width:17px; height:17px; }
  select { appearance:none; -webkit-appearance:none; }
  button { font-family:inherit; }
  .app { max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
  .head { position:sticky; top:0; z-index:10; background:var(--card); padding:10px 14px;
          padding-top:calc(10px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:6px;
          border-bottom:1px solid var(--line); }
  .row-between { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .title { font-weight:500; font-size:16px; letter-spacing:-0.01em; }
  .reset { flex:none; min-height:36px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
           background:transparent; color:var(--text); font-size:12px; cursor:pointer; }
  .players-label { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  select.players { color:var(--text); background:var(--bg); border:1px solid var(--line); }
  select.players { flex:1; min-height:38px; padding:4px 10px; font-size:13px; border-radius:8px; }
  .tabs { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tab { flex:1; min-height:40px; padding:6px 10px; font-size:13px; border:none; cursor:pointer;
         background:transparent; color:var(--text); }
  .tab.right { border-left:1px solid var(--line); }
  .tab.active { background:var(--bg); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .body { flex:1; padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .hint { font-size:11px; color:var(--muted2); }
  .card { background:var(--card); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .sec-toggle { all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; min-height:34px; }
  .sec-label { font-weight:500; font-size:14px; }
  .sec-chevron { font-size:11px; color:var(--muted2); }
  .sec-note { font-size:11px; color:var(--muted2); }
  .subgroup { display:flex; flex-direction:column; gap:4px; background:rgba(233,233,237,0.04); border-radius:6px; padding:2px 8px; }
  .sub-toggle { all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; min-height:32px; }
  .sub-label { font-size:12.5px; font-weight:500; color:rgba(233,233,237,0.85); }
  .placement { display:flex; flex-direction:column; gap:2px; padding:4px 0; border-bottom:1px solid var(--line-soft); }
  .placement:last-child { border-bottom:none; }
  /* Done spots recede but stay readable - you still want to check what you entered. */
  .placement.scoped .pl-name, .placement.scoped .pl-pct { opacity:0.5; }
  .placement.scoped .slider-row { opacity:0.6; }
  .scout-box { flex:none; margin:0; }
  .scout-head { display:flex; flex-direction:column; gap:5px; background:var(--card); border-radius:8px; padding:9px 10px; }
  .scout-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .scout-count { font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums; }
  .scout-clear { flex:none; min-height:28px; padding:0 9px; border-radius:7px; border:1px solid var(--line);
                 background:transparent; color:var(--muted); font-size:10.5px; cursor:pointer; }
  .sec-done { color:var(--accent); }
  .pl-row { display:flex; align-items:center; gap:6px; min-height:32px; }
  /* The item name doubles as the picker: a transparent native <select> sits on top of it, so one
     tap opens the phone's own wheel/list instead of a custom in-page menu. It stretches to the full
     row height - left to size on its text alone the tap target collapses to ~19px. */
  .pl-pick { position:relative; flex:1; min-width:0; display:flex; align-items:center; gap:5px;
             align-self:stretch; min-height:32px; }
  .pl-pick select { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none;
                    background:transparent; font-size:16px; }
  .pl-name { flex:1; min-width:0; font-size:12.5px; font-weight:500;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-caret { flex:none; font-size:8px; color:var(--muted2); }
  .pl-pct { flex:none; font-size:10.5px; color:var(--muted2); font-variant-numeric:tabular-nums; }
  .pl-remove { all:unset; cursor:pointer; font-size:11px; color:var(--muted2); min-height:30px; padding:0 4px; }
  .chip { flex:none; min-height:28px; padding:0 8px; border-radius:7px; border:1px solid var(--line);
          background:transparent; color:var(--muted); font-size:10.5px; cursor:pointer;
          touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#161826; font-weight:600; }
  .chip.dim { opacity:0.35; }
  .slider-row { display:flex; align-items:center; gap:6px; min-height:36px; }
  .slider-row input[type=range] { flex:1; min-width:0; }
  /* 16px keeps iOS from zooming the page when this gets focus. */
  .val-input { flex:none; width:62px; text-align:right; font-size:16px; font-variant-numeric:tabular-nums;
               background:transparent; border:1px solid transparent; border-radius:6px; color:var(--text);
               padding:3px 3px; min-height:32px; font-family:inherit; }
  .val-input:focus { border-color:var(--accent); background:rgba(0,0,0,0.25); outline:none; }
  .val-k { flex:none; font-size:11px; color:var(--muted2); margin-left:-3px; }
  .step-btn { flex:none; width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
              background:rgba(233,233,237,0.06); color:var(--text); font-size:17px; line-height:1;
              cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; padding:0; }
  .step-btn:active { background:var(--accent); color:#161826; }
  .add-deposit { all:unset; cursor:pointer; font-size:12px; color:var(--accent); min-height:32px; }
  .note-box { font-size:11px; line-height:1.4; color:var(--muted); background:var(--card); border-radius:8px; padding:8px 10px; }
  .modes { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card); }
  .mode { flex:1; min-width:0; padding:8px 6px; border:none; cursor:pointer; background:transparent; color:var(--text);
          display:flex; flex-direction:column; align-items:center; gap:1px; touch-action:manipulation; }
  .mode.right { border-left:1px solid var(--line); }
  .mode.active { background:var(--bg); box-shadow:inset 0 0 0 1px var(--accent); }
  .mode-name { font-size:12px; }
  .mode.active .mode-name { color:var(--accent); font-weight:600; }
  .mode-val { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  .mode-sub { font-size:9.5px; color:var(--muted2); text-align:center; }
  .warn-box { background:#3a2f1c; border:1px solid #7a6224; border-radius:8px; padding:9px 11px;
              display:flex; flex-direction:column; gap:3px; }
  .warn-title { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#f0c860; }
  .warn-item { display:flex; flex-direction:column; gap:1px; }
  .warn-line { font-size:12.5px; color:#f6e6bd; line-height:1.35; }
  .warn-foot { font-size:10.5px; color:rgba(246,230,189,0.55); }
  .warn-item.orphan .warn-foot { color:#ffb4a2; }
  .p-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  /* 16px so focusing it doesn't zoom the page on iOS. */
  .p-name { flex:1; min-width:0; font-weight:500; font-size:16px; font-family:inherit; color:var(--text);
            background:transparent; border:1px solid transparent; border-radius:6px; padding:3px 5px;
            margin-left:-5px; min-height:30px; }
  .p-name::placeholder { color:var(--text); opacity:1; }
  .p-name:hover { border-color:var(--line-soft); }
  .p-name:focus { border-color:var(--accent); background:rgba(0,0,0,0.25); outline:none; }
  .p-meta { font-size:11.5px; color:var(--muted); }
  .p-sub { font-size:11px; color:var(--accent); margin-top:-2px; }
  .bar { height:7px; border-radius:4px; background:var(--bg); overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); border-radius:4px; }
  .res-row { display:flex; align-items:flex-start; gap:9px; padding:7px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .res-row input[type=checkbox] { flex:none; margin:2px 0 0; }
  .res-body { flex:1; min-width:0; display:flex; flex-direction:column; }
  .res-row.picked .res-body { opacity:0.42; }
  .res-row.picked .res-line { text-decoration:line-through; }
  .res-line { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; }
  .res-sub { font-size:10.5px; color:var(--muted2); }
  .bag-total { display:flex; justify-content:space-between; align-items:baseline; padding-top:6px; border-top:1px solid var(--line); }
  .bag-total-label { font-size:11.5px; color:var(--muted); }
  .bag-total-val { font-weight:600; font-size:18px; }
  .bonus-box { font-size:12px; color:#d2cefd; background:#2b2741; border-radius:8px; padding:8px 10px; }
  .grand { background:#262a60; border-radius:8px; padding:12px; display:flex; justify-content:space-between; align-items:center; }
  .grand-label { font-size:12.5px; }
  .grand-val { font-weight:600; font-size:20px; color:#f5f4ff; }
  .share-btn { width:100%; min-height:44px; border-radius:8px; border:1px solid var(--accent);
               background:transparent; color:var(--accent); font-size:14px; font-weight:600;
               cursor:pointer; touch-action:manipulation; }
  .share-btn:active { background:var(--accent); color:#161826; }
  .share-url { width:100%; min-height:36px; font-size:16px; font-family:inherit; padding:4px 8px;
               border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  .empty-msg { font-size:11.5px; color:var(--muted2); }
  .footer { text-align:center; font-size:10px; color:var(--muted2); padding:14px 12px 20px; }
  .footer a { color:var(--accent); text-decoration:none; }
</style>
</head>

  { id: 'westcor',  label: 'Upper Gallery - West Corridor', assignable: true },
  { id: 'eastwall', label: 'Upper Gallery - East Wall',     assignable: true },
  { id: 'crisp',    label: 'Crisp Gallery',                 assignable: true, crew: true },

const CLUSTER_INDEX = {};
CLUSTERS.forEach((c, i) => { CLUSTER_INDEX[c.id] = i; });

// standing on it. Crossing to another FLOOR is the thing worth avoiding, and the only thing the
// plan tries to avoid.

// but nearer than crossing to the Upper Gallery. It belongs to whoever works the Lower Gallery

// its spots went unlooted every run. The stairs still cost something in the walk, which the cluster

  { id: 'lower', label: 'Lower Gallery',                 clusters: ['backexit', 'south', 'westarm', 'north'] },

const ALARM_FLOOR = 'lower';

const FLOOR_CLUSTERS = {};

FLOORS.forEach(f => { FLOOR_CLUSTERS[f.id] = f.clusters; FLOOR_LABEL[f.id] = f.label; });

function floorAssignments(playerCount) {
  let out = [[]];
  for (let i = 0; i < playerCount; i++) out = out.flatMap(prefix => FLOOR_IDS.map(f => [...prefix, f]));

/* ---------------- Helpers ---------------- */
function getCategory(id) { return LOOT_DATA.categories.find(c => c.categoryId === id); }
function findItem(categoryId, itemName) { return getCategory(categoryId).items.find(it => it.itemName === itemName); }
function groupByType(items) {
  const order = []; const map = {};
  items.forEach(it => { if (!map[it.itemType]) { map[it.itemType] = []; order.push(it.itemType); } map[it.itemType].push(it); });
  return order.map(t => ({ itemType: t, items: map[t] }));
}
function itemMid(item) {
  const step = item.valueIncrement || 500;
  const raw = (item.valueMin + item.valueMax) / 2;
  const snapped = item.valueMin + Math.round((raw - item.valueMin) / step) * step;
  return Math.min(item.valueMax, Math.max(item.valueMin, snapped));
}
function fmtK(v) { const k = v / 1000; return Number.isInteger(k) ? String(k) : k.toFixed(1); }
function itemDisplayLabel(item) {

  const typeLower = item.itemType.toLowerCase();

}
// These types name a material or a stone rather than the piece itself, so "Ivory" or "Ruby" on its
// own doesn't tell you what you're looking at - they keep the type in front. Every other type has a
// distinctive name ("Sod Off", "Byzantine Hoops") where the prefix would just eat phone row width.
const TYPE_LED_NAMES = ['Fertility Statue', 'Venus Statue', 'Gemstone'];
function shortLabel(item) {
  return TYPE_LED_NAMES.includes(item.itemType) ? `${item.itemType} — ${item.itemName}` : item.itemName;
}
function mk(prefix, kind, count) {

}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* 0/1 knapsack over 5% weight buckets */
function knapsack(items, capacityPct) {
  const capUnits = Math.max(0, Math.round(capacityPct / 5));
  const n = items.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(capUnits + 1).fill(0));
  for (let i = 1; i <= n; i++) {
    const w = Math.round(items[i - 1].pct / 5);
    const v = items[i - 1].value;
    for (let c = 0; c <= capUnits; c++) {
      dp[i][c] = dp[i - 1][c];
      if (w <= c && dp[i - 1][c - w] + v > dp[i][c]) dp[i][c] = dp[i - 1][c - w] + v;
    }
  }
  let c = capUnits;
  const chosen = [];
  for (let i = n; i >= 1; i--) {
    if (dp[i][c] !== dp[i - 1][c]) { chosen.push(items[i - 1]); c -= Math.round(items[i - 1].pct / 5); }
  }
  const totalPct = chosen.reduce((s, it) => s + it.pct, 0);
  return { items: chosen, value: dp[n][capUnits], pct: totalPct };
}

// Ties in the knapsack favor whichever item comes first in the input array, so ordering the input by
// how far each item sits from the player's own cluster pulls ties toward loot they're already
// standing next to. It never overrides value - a genuinely richer item further out still wins.
function sortByDistanceFrom(items, patch) {
  return items.slice().sort((a, b) => {
    const da = distanceToPatch(a.cluster, patch), db = distanceToPatch(b.cluster, patch);
    if (da !== db) return da - db;
    if (a.locationOrder !== b.locationOrder) return a.locationOrder - b.locationOrder;
    return b.value - a.value;
  });
}

const STORAGE_KEY = 'kortzLootCalculatorState_v1';

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable, ignore */ }
}
function loadState() {

    Object.assign(state, saved);
    // migrate old buyerRequests shape ([{itemId,player}]) to the new plain-id array
    if (Array.isArray(state.buyerRequests)) {
      state.buyerRequests = state.buyerRequests.map(br => (typeof br === 'string' ? br : br && br.itemId)).filter(Boolean);
    }

/* ---------------- Share links ---------------- */
// There is no server behind this page, so a shared plan has to travel inside the link itself. The
// whole scouted run is packed into the URL fragment: a fragment is never sent to any host, so the
// plan stays between whoever holds the link.
//
// Encoded by position rather than as plain JSON of the state. Placements are a fixed, ordered list,
// so each one needs only which item is in it and how many increments above its floor the value sits
// - two base-36 digits in the common case. Naming every id and item in full runs several kilobytes,
// which messaging apps are apt to wrap or truncate; this stays a few hundred characters.
const SHARE_VERSION = 1;

function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s) {
  const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
// The step a placement's value moves in, and the item list it picks from - shared by both directions
// so the encoder and decoder can never disagree about what a token means.
function slotCodec(pl) {
  const cat = getCategory(KIND_TO_CATEGORY[pl.kind]);
  return { items: cat.items, fallbackStep: pl.kind === 'crate' ? 5000 : 500 };
}

function encodePlan() {
  const placements = allPlacements();
  // An 'x' prefix marks the spot empty, and the item and value still ride along behind it. Encoding
  // emptiness *instead of* the reading loses what was scouted the moment anyone un-ticks the box.
  const s = placements.map(pl => {
    const slot = state.slots[pl.id] || {};
    const { items, fallbackStep } = slotCodec(pl);
    let idx = pl.kind === 'crate' ? 0 : items.findIndex(it => it.itemName === (slot.itemKey || (SPOTS[pl.id] || {}).item));
    if (idx < 0) idx = 0;
    const item = items[idx];
    const step = item.valueIncrement || fallbackStep;
    const value = slot.value !== undefined ? slot.value : (pl.kind === 'crate' ? item.valueMin : itemMid(item));
    return ((slot.empty || slot.skip) ? 'x' : '')
      + idx.toString(36) + '.' + Math.round((value - item.valueMin) / step).toString(36);
  });
  const ids = placements.map(pl => pl.id);
  return b64urlEncode(JSON.stringify({
    v: SHARE_VERSION,
    n: state.playerCount,
    m: state.resultMode === 'fastest' ? 'f' : 'p',
    s,
    d: getDepositBoxes().map((val, i) => ((state.slots['vault_depositbox_' + i] || {}).empty ? 'x' : '')
      + Math.round((val - 5000) / 500).toString(36)),
    b: state.buyerRequests.map(id => ids.indexOf(id)).filter(i => i >= 0),
    p: state.playerNames || {},
  }));
}

// Clamped on the way in at every step: a link can be truncated, hand-edited or built by an older
// version of the page, and none of that should be able to produce an item or a value that isn't real.
function decodePlan(encoded) {
  const o = JSON.parse(b64urlDecode(encoded));
  if (!o || o.v !== SHARE_VERSION || !Array.isArray(o.s)) return false;
  const placements = allPlacements();
  const slots = {};
  placements.forEach((pl, i) => {
    let token = o.s[i];
    if (typeof token !== 'string') return;
    const isEmpty = token.charAt(0) === 'x';
    if (isEmpty) token = token.slice(1);
    const [rawIdx, rawStep] = token.split('.');
    const { items, fallbackStep } = slotCodec(pl);
    const idx = Math.min(items.length - 1, Math.max(0, parseInt(rawIdx, 36) || 0));
    const item = items[idx];
    const step = item.valueIncrement || fallbackStep;
    const value = Math.min(item.valueMax, Math.max(item.valueMin,
      item.valueMin + (parseInt(rawStep, 36) || 0) * step));
    const slot = pl.kind === 'crate' ? { value } : { itemKey: item.itemName, value };
    if (isEmpty) slot[pl.kind === 'crate' ? 'skip' : 'empty'] = true;
    slots[pl.id] = slot;
  });

  const deposits = [];
  (Array.isArray(o.d) ? o.d : []).forEach((token, i) => {
    let t = String(token);
    if (t.charAt(0) === 'x') { t = t.slice(1); slots['vault_depositbox_' + i] = { empty: true }; }
    deposits.push(Math.min(12500, Math.max(5000, 5000 + (parseInt(t, 36) || 0) * 500)));
  });

  state.slots = slots;
  state.depositBoxes = deposits;
  state.playerCount = Math.min(4, Math.max(1, parseInt(o.n, 10) || 1));
  state.resultMode = o.m === 'f' ? 'fastest' : 'payout';
  state.buyerRequests = (Array.isArray(o.b) ? o.b : [])
    .map(i => (placements[i] || {}).id).filter(Boolean).slice(0, MAX_BUYER_REQUESTS);
  state.playerNames = (o.p && typeof o.p === 'object') ? o.p : {};

  // plan arrives with them clear rather than carrying ticks against loot you never looked at.
  state.pickedUp = {};
  state.scoped = {};
  return true;
}

function shareUrl() { return location.href.split('#')[0] + '#plan=' + encodePlan(); }

// True only for the load that came in on a link, so the banner marks the hand-off and then goes away.
let openedFromShare = false;

// A shared link is applied ONCE per device, and which one was applied is remembered rather than
// inferred from the URL. Stripping the fragment with replaceState is not enough on its own: inside
// a sandboxed iframe or an in-app browser - which is exactly where a link from a chat app opens -
// replaceState is blocked, the fragment survives every reload, and the plan gets re-applied on top
// of whatever the recipient has since changed. Their edits save correctly and are then overwritten
// on the next load, which reads as the plan being welded shut.
//
// Remembering the token fixes it wherever the URL can't be rewritten, and still lets a NEW link
// through, so a host who re-shares an updated plan is picked up as normal.
const APPLIED_SHARE_KEY = 'kortzLootCalculatorOpenedShare_v1';
function applySharedPlan() {
  const m = /[#&]plan=([A-Za-z0-9\-_]+)/.exec(location.hash);
  if (!m) return false;
  const token = m[1];
  let alreadyOpened = null;
  try { alreadyOpened = localStorage.getItem(APPLIED_SHARE_KEY); } catch (e) { /* storage off */ }
  // Same link as last time: this is a reload, not a hand-off. Their own edits win.
  if (alreadyOpened === token) return false;

  let ok = false;
  try { ok = decodePlan(token); } catch (e) { ok = false; }
  if (ok) { try { localStorage.setItem(APPLIED_SHARE_KEY, token); } catch (e) { /* storage off */ } }
  // Still worth dropping the fragment where it's allowed - a clean URL is easier to re-share.
  try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { /* blocked - handled above */ }
  return ok;

function computeDefaultItemKeys() {

    if (known && items.some(it => it.itemName === known)) { map[pl.id] = known; return; }
    const idx = (counters[categoryId] || 0) % items.length;

        pool.push({ id: pl.id, pct: item.bagWeightPercent, value: slot.value !== undefined ? slot.value : defaultVal, categoryLabel: itemDisplayLabel(item), ...common });
      } else {
        const slot = state.slots[pl.id] || {};
        if (slot.empty) return;
        const itemKey = slot.itemKey || defaultItemKeys[pl.id];
        const item = findItem(categoryId, itemKey);
        const value = slot.value !== undefined ? slot.value : itemMid(item);
        pool.push({ id: pl.id, pct: item.bagWeightPercent, value, categoryLabel: itemDisplayLabel(item), ...common });
      }
    });
  });
  return pool;
}

// Buyer's Requests are heist-wide, not tied to a specific player: force each flagged item into
// whichever eligible player currently has the most spare capacity. A player barred from Crisp
// (see hackerIdx below) can never be forced to hold a Crisp item.
function forceAssignBuyerRequests(validRequests, playerCount, hackerIdx) {
  const lockedByPlayer = Array.from({ length: playerCount }, () => []);
  const loadPct = new Array(playerCount).fill(0);
  let fulfilledCount = 0;
  validRequests.forEach(item => {
    const eligible = [];
    for (let i = 0; i < playerCount; i++) {
      if (item.isCrisp && (hackerIdx === null || i === hackerIdx)) continue;
      if (loadPct[i] + item.pct > 100) continue;
      eligible.push(i);
    }
    if (!eligible.length) return; // unreachable under this plan - left unfulfilled, scored accordingly
    const target = eligible.reduce((b, i) => (loadPct[i] < loadPct[b] ? i : b), eligible[0]);
    lockedByPlayer[target].push(item);
    loadPct[target] += item.pct;
    fulfilledCount++;
  });
  return { lockedByPlayer, fulfilledCount };
}

// Evaluates one candidate crew plan: a patch (a run of neighbouring clusters) per player, plus who
// (if anyone) is the Crisp Gallery "Hacker" - excluded from every Crisp item, everywhere, in exchange
// for letting the crew access Crisp Gallery at all. hackerIdx === null means nobody hacks, so no one
// gets Crisp loot.
function evaluatePlan(pool, playerCount, clusterAssign, hackerIdx, validRequests, patchFirst) {
  const { lockedByPlayer, fulfilledCount } = forceAssignBuyerRequests(validRequests, playerCount, hackerIdx);
  const claimedIds = new Set();
  lockedByPlayer.forEach(items => items.forEach(it => claimedIds.add(it.id)));

  const players = [];
  for (let i = 0; i < playerCount; i++) {
    const floorId = clusterAssign[i];
    const patch = patchFor(floorId);
    const locked = lockedByPlayer[i];
    const lockedPct = locked.reduce((s, it) => s + it.pct, 0);
    const lockedValue = locked.reduce((s, it) => s + it.value, 0);
    const capacity = Math.max(0, 100 - lockedPct);
    const crispBlocked = it => it.isCrisp && (hackerIdx === null || i === hackerIdx);

    const available = pool.filter(it => !claimedIds.has(it.id) && !crispBlocked(it));
    let own, top;

    if (patchFirst) {
      // FASTEST. Work your own floor, then cross to another one only with whatever bag is left over.
      // Two passes rather than one knapsack over everything, because proximity has to actually cost
      // something to matter: as a tie-break it never fires (item values are rarely exactly equal)
      // and every player just converges on the same richest loot wherever it sits, which makes the
      // assignment describe nothing.
      //
      // The whole floor is in reach here, every cluster on it - clusters order the walk, they don't
      // ration it. Vault and Garage count as "own floor" for everyone; they're on the way regardless.
      const inPatch = available.filter(it => distanceToPatch(it.cluster, patch) === 0);
      const outside = available.filter(it => distanceToPatch(it.cluster, patch) > 0);
      own = knapsack(sortByDistanceFrom(inPatch, patch), capacity);
      const spare = capacity - own.pct;
      top = spare > 0 ? knapsack(sortByDistanceFrom(outside, patch), spare) : { items: [], value: 0, pct: 0 };
    } else {
      // HIGHEST PAYOUT. One knapsack over the whole remaining pool for the whole bag, which is what
      // guarantees true value-maximality. Distance still orders the input, so among equally rich
      // sets the nearer one wins - but a richer item on the far side of the building always beats a
      // closer one, and the walk is whatever it has to be.
      own = knapsack(sortByDistanceFrom(available, patch), capacity);
      top = { items: [], value: 0, pct: 0 };
    }

    const fillItems = [...own.items, ...top.items];
    fillItems.forEach(it => claimedIds.add(it.id));

    // Distance-weighted rather than a plain in/out count: what matters is how far you had to reach,
    // so 30% one room over beats 30% across the map.
    const spillPct = fillItems.reduce((s, it) => s + it.pct * distanceToPatch(it.cluster, patch), 0);

    players.push({ num: i + 1, floorId, patch, isHacker: i === hackerIdx, lockedItems: locked, fillItems, value: own.value + top.value + lockedValue, pctUsed: own.pct + top.pct + lockedPct, spillPct });
  }
  const bonusActive = fulfilledCount === MAX_BUYER_REQUESTS && validRequests.length === MAX_BUYER_REQUESTS;
  const totalValue = players.reduce((s, p) => s + p.value, 0) + (bonusActive ? BUYER_REQUEST_BONUS : 0);
  const totalSpillPct = players.reduce((s, p) => s + p.spillPct, 0);
  return { players, bonusActive, fulfilledCount, totalValue, totalSpillPct };
}

// Searches every plan for one crew size and mode, given the requests it is being asked to force.
// Solo has no patch or Hacker concept (Crisp Gallery isn't reachable at 1 player anyway) - it owns
// the whole route, so every item is distance 0 and the knapsack just maximizes value, ordered as a
// walk. It runs through the same evaluatePlan as the crew sizes.
function solvePlans(pool, playerCount, forced, patchFirst) {
  if (playerCount <= 1) return evaluatePlan(pool, 1, [null], null, forced, patchFirst);

  // Brute-force every floor assignment x Hacker choice, keeping the best plan in strict priority:
  //  1. Fulfill as many Buyer's Requests as physically possible - always takes priority.
  //  2. Maximize total crew value.
  //  3. Least total distance-weighted spillover (stay on your own floor when the value ties).
  let best = null;
  const hackerCandidates = [null, ...Array.from({ length: playerCount }, (_, i) => i)];
  floorAssignments(playerCount).forEach(assign => {
    hackerCandidates.forEach(hackerIdx => {
      // The Hacker avoids the floor holding Crisp Gallery when possible - they're stuck at the door,
      // so those items only reach them as a genuine last-resort spillover.
      if (hackerIdx !== null && FLOOR_CLUSTERS[assign[hackerIdx]].includes('crisp')) return;
      const result = evaluatePlan(pool, playerCount, assign, hackerIdx, forced, patchFirst);
      const better = !best
        || result.fulfilledCount > best.fulfilledCount
        || (result.fulfilledCount === best.fulfilledCount && result.totalValue > best.totalValue)
        || (result.fulfilledCount === best.fulfilledCount && result.totalValue === best.totalValue && result.totalSpillPct < best.totalSpillPct);
      if (better) best = result;
    });
  });
  return best;
}

// The bonus is all or nothing: two Buyer's Requests out of three pay exactly what none pay. So the
// moment the full set can't land, chasing it is pure loss - it forces low-value items into bags and
// bumps out better loot to buy a bonus that will never arrive. Whenever the set can't be completed,
// the requests are dropped entirely and the plan goes for maximum cash, and the results say why.
//
// Solo is where this bites hardest: anything scouted in the Crisp Gallery isn't in a solo pool at
// all, so a request pinned there is unreachable before the search even starts.
function computeCrewPlan(pool, playerCount, buyerRequestIds, patchFirst) {
  const reachable = buyerRequestIds.map(id => pool.find(it => it.id === id)).filter(Boolean);
  const unreachable = buyerRequestIds.length - reachable.length;
  const fullSet = buyerRequestIds.length === MAX_BUYER_REQUESTS && unreachable === 0;

  let best = solvePlans(pool, playerCount, fullSet ? reachable : [], patchFirst);
  let dropped = null;
  if (fullSet) {
    // All three exist, but no arrangement of bags can carry them all.
    if (best.fulfilledCount < MAX_BUYER_REQUESTS) { dropped = 'nofit'; best = solvePlans(pool, playerCount, [], patchFirst); }
  } else if (buyerRequestIds.length) {
    dropped = unreachable ? 'unreachable' : 'incomplete';
  }
  return { ...best, dropped, unreachable, selectedCount: buyerRequestIds.length };
}

/* ---------------- Mutations ---------------- */
function setTab(t) { state.tab = t; saveState(); render(); }
function setResultMode(m) { state.resultMode = m; saveState(); render(); }
// No re-render: the name is a label, and redrawing mid-word would take the keyboard away.
function setPlayerName(num, name) { state.playerNames[num] = name; saveState(); }
function setPlayerCount(n) { state.playerCount = n; saveState(); render(); }
function resetAll() {
  state.slots = {}; state.depositBoxes = null; state.buyerRequests = []; state.pickedUp = {}; state.scoped = {};
  // Forget which link was opened too, so re-opening it after a Reset loads the plan again rather
  // than being mistaken for a reload.
  try { localStorage.removeItem(APPLIED_SHARE_KEY); } catch (e) { /* storage off */ }
  saveState(); render();
}
function togglePickedUp(id) { state.pickedUp[id] = !state.pickedUp[id]; saveState(); render(); }
function toggleScoped(id) { state.scoped[id] = !state.scoped[id]; saveState(); render(); }
// Clears the ticks only - the scouted values stay, so a second run round the building starts from
// last run's readings rather than from nothing.
function clearScoped() { state.scoped = {}; saveState(); render(); }

// Editing a spot IS scouting it, so the tick follows the work instead of being a second chore.
// Slider drags don't re-render (that would fight the thumb), so the row and the counters are
// nudged in place here rather than being redrawn.
function markScoped(id) {
  if (state.scoped[id]) return;
  state.scoped[id] = true;
  saveState();
  const box = bodyEl.querySelector(`input[data-act="scoped"][data-id="${CSS.escape(id)}"]`);
  if (box) {
    box.checked = true;
    const row = box.closest('.placement');
    if (row) row.classList.add('scoped');
  }
  refreshScoutCounts();
}
function refreshScoutCounts() {
  getClusters().forEach(sec => {
    const el = bodyEl.querySelector(`[data-scout="${sec.id}"]`);
    if (el) el.textContent = scoutTally(clusterScoutIds(sec));
  });
  const ids = allScoutIds(), done = scoutedCount(ids);
  const label = bodyEl.querySelector('[data-scout="all"]');
  if (label) label.textContent = `${done} of ${ids.length} spots scoped`;
  const fill = bodyEl.querySelector('[data-scout-bar]');
  if (fill) fill.style.width = (ids.length ? (100 * done / ids.length) : 0) + '%';
}
function scoutTally(ids) { return `${scoutedCount(ids)}/${ids.length}`; }
function toggleCollapse(id) { state.collapsed[id] = !state.collapsed[id]; saveState(); render(); }
function toggleEmpty(id) { const cur = state.slots[id] || {}; state.slots[id] = { ...cur, empty: !cur.empty }; state.scoped[id] = true; saveState(); render(); }
function toggleSkip(id) { const cur = state.slots[id] || {}; state.slots[id] = { ...cur, skip: !cur.skip }; state.scoped[id] = true; saveState(); render(); }
function setItemKey(id, categoryId, itemName) {
  const item = findItem(categoryId, itemName); const cur = state.slots[id] || {};
  state.slots[id] = { ...cur, empty: false, itemKey: itemName, value: itemMid(item) };
  state.scoped[id] = true; saveState(); render();
}
function setValue(id, val) { const cur = state.slots[id] || {}; state.slots[id] = { ...cur, value: val }; markScoped(id); saveState(); }
function addDepositBox() { const arr = getDepositBoxes(); state.depositBoxes = [...arr, 7500]; saveState(); render(); }
function removeDepositBox(idx) {
  const arr = getDepositBoxes();
  // Deposit box slots are keyed by index, so removing one has to shift every later box's
  // Empty flag down with it or the flags land on the wrong boxes.
  const flags = arr.map((_, i) => !!(state.slots[`vault_depositbox_${i}`] || {}).empty).filter((_, i) => i !== idx);
  arr.forEach((_, i) => { delete state.slots[`vault_depositbox_${i}`]; });
  flags.forEach((isEmpty, i) => { if (isEmpty) state.slots[`vault_depositbox_${i}`] = { empty: true }; });
  state.depositBoxes = arr.filter((_, i) => i !== idx);
  saveState(); render();
}
function setDepositBoxValue(idx, val) {
  const arr = getDepositBoxes().slice(); arr[idx] = val; state.depositBoxes = arr;
  markScoped('vault_depositbox_' + idx); saveState();
}
function toggleBuyerRequest(id) {
  const exists = state.buyerRequests.includes(id);
  if (exists) { state.buyerRequests = state.buyerRequests.filter(x => x !== id); saveState(); render(); return; }
  if (state.buyerRequests.length >= MAX_BUYER_REQUESTS) return;
  state.buyerRequests = [...state.buyerRequests, id]; saveState(); render();
}

/* ---------------- Render ---------------- */
const bodyEl = document.getElementById('body');

function render() {
  const pool = buildPool();
  const poolTotalValue = pool.reduce((s, it) => s + it.value, 0);

  // header tab labels / active states
  document.getElementById('tabItems').textContent = `Loot Available - ${pool.length}`;
  document.getElementById('playerSelect').value = String(state.playerCount);
  document.getElementById('tabItems').classList.toggle('active', state.tab === 'items');
  document.getElementById('tabResults').classList.toggle('active', state.tab === 'results');

  if (state.tab === 'items') {
    bodyEl.innerHTML = renderItemsTab(pool, poolTotalValue);
  } else {
    bodyEl.innerHTML = renderResultsTab(pool);
  }
  attachListeners();
}

function renderItemsTab(pool, poolTotalValue) {
  const defaultItemKeys = computeDefaultItemKeys();
  const depositBoxes = getDepositBoxes();
  const scoutIds = allScoutIds();
  const scoutDone = scoutedCount(scoutIds);
  let html = `<div class="hint">${pool.length} items in play - $${fmtK(poolTotalValue)}k total pool value</div>
    <div class="scout-head">
      <div class="scout-row"><span class="scout-count" data-scout="all">${scoutDone} of ${scoutIds.length} spots scoped</span>
        ${scoutDone ? `<button class="scout-clear" data-act="clear-scoped">Clear ticks</button>` : ''}</div>
      <div class="bar"><div class="bar-fill" data-scout-bar style="width:${scoutIds.length ? (100 * scoutDone / scoutIds.length) : 0}%"></div></div>
    </div>
    <div class="hint">Tick a spot once you've checked it in game. Setting a value, changing the item or marking it Empty ticks it for you. Tap an item name to change it, tap its value to type an exact number, ★ marks a Buyer's Request.</div>`;

  // Every cluster is always listed - you scope the Crisp Gallery on setup missions regardless of
  // crew size, so its values are always worth recording. Player count only gates the Results tab.
  getClusters().forEach(sec => {
    const collapsed = !!state.collapsed[sec.id];
    const lockedOut = sec.crew && state.playerCount < 2;
    const secIds = clusterScoutIds(sec);
    const secDone = scoutedCount(secIds) === secIds.length && secIds.length > 0;
    html += `<div class="card"><button class="sec-toggle" data-act="collapse" data-id="${sec.id}">
      <span class="sec-label">${secDone ? '<span class="sec-done">✓</span> ' : ''}${esc(sec.label)}</span>
      <span class="sec-chevron"><span data-scout="${sec.id}">${scoutTally(secIds)}</span> &middot; ${collapsed ? '▸ show' : '▾ hide'}</span></button>`;
    if (!collapsed) {
      if (lockedOut) html += `<div class="sec-note">Needs 2+ players - values save, but stay out of solo results</div>`;
      if (sec.note) html += `<div class="sec-note">${esc(sec.note)}</div>`;
      sec.placements.forEach(pl => { html += renderPlacement(pl, sec, defaultItemKeys); });

      // Deposit boxes have no fixed spot and are add/remove rather than scouted, so they stay a
      // nested group inside the Vault rather than sitting inline with the paintings.
      if (sec.id === 'vault') {
        const subId = `${sec.id}::depositbox`;
        const subCollapsed = !!state.collapsed[subId];
        html += `<div class="subgroup"><button class="sub-toggle" data-act="collapse" data-id="${subId}">
          <span class="sub-label">Deposit Boxes (${depositBoxes.length})</span>
          <span class="sec-chevron">${subCollapsed ? '▸ show' : '▾ hide'}</span></button>`;
        if (!subCollapsed) {
          depositBoxes.forEach((val, idx) => { html += renderDepositBox(idx, val, depositBoxes.length > 1); });
          html += `<button class="add-deposit" data-act="add-deposit">+ Add deposit box</button>`;
        }
        html += `</div>`;
      }
    }
    html += `</div>`;
  });
  return html;
}

// One placement is two rows: the spot number + what's in it (tap to change), then the value
// (drag, nudge, or type). Nothing that isn't needed every run gets a row of its own.
function renderPlacement(pl, sec, defaultItemKeys) {
  const categoryId = KIND_TO_CATEGORY[pl.kind];

  if (pl.kind === 'crate') {
    const item = getCategory(categoryId).items[0];
    const slot = state.slots[pl.id] || {};
    const skip = !!slot.skip;
    const value = slot.value !== undefined ? slot.value : item.valueMin;
    let h = `<div class="placement${state.scoped[pl.id] ? ' scoped' : ''}"><div class="pl-row">
      ${scoutBox(pl.id)}
      <div class="pl-pick"><span class="pl-name">${esc(item.itemName)}</span></div>
      <button class="chip${skip ? ' on' : ''}" data-act="skip" data-id="${pl.id}">Skip</button></div>`;
    if (!skip) h += valueRow(pl.id, item.valueMin, item.valueMax, item.valueIncrement || 5000, value, false, item.bagWeightPercent);
    return h + `</div>`;
  }

  const slot = state.slots[pl.id] || {};
  const empty = !!slot.empty;
  const cat = getCategory(categoryId);
  const itemKey = slot.itemKey || defaultItemKeys[pl.id];
  const item = findItem(categoryId, itemKey);
  const value = slot.value !== undefined ? slot.value : itemMid(item);

  const isBuyerRequest = state.buyerRequests.includes(pl.id);
  const buyerFull = state.buyerRequests.length >= MAX_BUYER_REQUESTS && !isBuyerRequest;

  let opts = '';
  groupByType(cat.items).forEach(g => {
    opts += `<optgroup label="${esc(g.itemType)}">`;
    g.items.forEach(it => {
      const sel = it.itemName === itemKey ? 'selected' : '';
      opts += `<option value="${esc(it.itemName)}" ${sel}>${esc(itemDisplayLabel(it))} — ${it.bagWeightPercent}%</option>`;
    });
    opts += `</optgroup>`;
  });

  let h = `<div class="placement${state.scoped[pl.id] ? ' scoped' : ''}"><div class="pl-row">
    ${scoutBox(pl.id)}
    <div class="pl-pick">
      <span class="pl-name" style="opacity:${empty ? 0.4 : 1}">${esc(shortLabel(item))}</span>
      <span class="pl-caret">▼</span>
      <select data-act="item" data-id="${pl.id}" data-cat="${categoryId}"
        aria-label="Change item">${opts}</select>
    </div>
    <button class="chip${empty ? ' on' : ''}" data-act="empty" data-id="${pl.id}">Empty</button>`;
  // Buyer's Requests are heist-wide - the crew auto-decides who ends up carrying it.
  if (!empty) {
    h += `<button class="chip${isBuyerRequest ? ' on' : ''}${buyerFull ? ' dim' : ''}" data-act="buyer"
      data-id="${pl.id}" aria-label="Buyer's Request">★</button>`;
  }
  h += `</div>`;

  if (!empty) h += valueRow(pl.id, item.valueMin, item.valueMax, item.valueIncrement || 500, value, false, item.bagWeightPercent);
  return h + `</div>`;
}

// The scouting tick. Deliberately the leftmost thing on the row, so a column of them reads as a
// checklist while you walk - which is the whole point of it.
function scoutBox(id) {
  return `<input type="checkbox" class="scout-box" data-act="scoped" data-id="${esc(id)}"
    ${state.scoped[id] ? 'checked' : ''} aria-label="Mark this spot scoped"/>`;
}

function renderDepositBox(idx, val, showRemove) {
  const id = `vault_depositbox_${idx}`;
  const empty = !!(state.slots[id] && state.slots[id].empty);
  let h = `<div class="placement${state.scoped[id] ? ' scoped' : ''}"><div class="pl-row">
    ${scoutBox(id)}
    <div class="pl-pick"><span class="pl-name" style="opacity:${empty ? 0.4 : 1}">Deposit Box ${idx + 1}</span></div>
    <button class="chip${empty ? ' on' : ''}" data-act="empty" data-id="${id}">Empty</button>`;
  if (showRemove) h += `<button class="pl-remove" data-act="remove-deposit" data-idx="${idx}">Remove</button>`;
  h += `</div>`;
  if (!empty) h += valueRow(id, 5000, 12500, 500, val, true, 5);
  return h + `</div>`;
}

// The typed field carries thousands ("41.5" = $41.5k) because that's how the values read in game,
// and it's a single tap + two keystrokes instead of hunting for an exact stop on a phone-width slider.
function valueRow(id, min, max, step, value, isDeposit, pct) {
  const idxAttr = isDeposit ? `data-idx="${id.replace('vault_depositbox_', '')}"` : '';
  // Bag weight lives here rather than up on the name line: it qualifies the number, and the name
  // line needs every pixel now that the checklist tick sits at its left.
  return `<div class="slider-row">
    <span class="pl-pct">${pct}%</span>
    <button class="step-btn" data-act="step" data-dir="-1" data-target="${esc(id)}" aria-label="Decrease">&minus;</button>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value}"
      data-act="${isDeposit ? 'deposit-slide' : 'slide'}" data-id="${esc(id)}" ${idxAttr}/>
    <button class="step-btn" data-act="step" data-dir="1" data-target="${esc(id)}" aria-label="Increase">+</button>
    <input class="val-input" type="text" inputmode="decimal" enterkeyhint="done" value="${fmtK(value)}"
      data-act="val" data-id="${esc(id)}" data-valfor="${esc(id)}" aria-label="Value in thousands"/>
    <span class="val-k">k</span></div>`;
}

// Nudges the range input and replays a normal input event so the existing slide handlers
// (state write, label update, live pool total) all run unchanged.
function stepSlider(targetId, dir) {
  const input = bodyEl.querySelector(`input[type=range][data-id="${CSS.escape(targetId)}"]`);
  if (!input) return;
  const step = parseFloat(input.step) || 1;
  const min = parseFloat(input.min), max = parseFloat(input.max);
  const next = Math.min(max, Math.max(min, parseFloat(input.value) + dir * step));
  if (next === parseFloat(input.value)) return;
  input.value = next;
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

// What has to happen before the plan below can actually be opened. Counted from the loot picked, not
// from what exists - if nothing in the plan is behind a plasma cutter, the host doesn't need one.
//
// The two are not the same kind of thing. The cutter is kit, sourced before the board. The alarm is
// a job done during the run, in the Lower Gallery, and every small case in the building stays shut
// until someone does it - so the notice names who is actually down there to do it.
function planNotices(players) {
  const picked = players.flatMap(p => [...p.lockedItems, ...p.fillItems]);
  const notices = [];

  const tall = picked.filter(it => it.kind === 'tall').length;
  if (tall) {
    notices.push({ line: `Plasma cutter — ${tall} tall glass ${tall === 1 ? 'case' : 'cases'} in this plan`,
                   foot: 'Kit, sourced by the host before the board.' });
  }

  const cases = picked.filter(it => it.kind === 'case').length;
  if (cases) {
    // Who genuinely sets foot in the Lower Gallery under this plan, rather than who is nominally
    // assigned it - that stays true on the Highest payout plan, where nobody is held to a floor.
    const there = players.filter(p => [...p.lockedItems, ...p.fillItems]
      .some(it => FLOOR_CLUSTERS[ALARM_FLOOR].includes(it.cluster))).map(p => p.num);
    notices.push({
      line: `Alarm — ${cases} small glass ${cases === 1 ? 'case' : 'cases'} stay shut until it's switched off in the Lower Gallery`,
      foot: there.length
        ? `${there.length > 1 ? 'Players' : 'Player'} ${there.join(' and ')} ${there.length > 1 ? 'are' : 'is'} down there anyway.`
        : 'Nobody in this plan goes to the Lower Gallery — somebody has to detour for it.',
      orphan: !there.length,
    });
  }
  return notices;
}

function renderResultsTab(pool) {
  const crew = state.playerCount > 1;
  // Both plans are always solved - the totals are the whole point of the choice, so each mode's
  // number sits on its own button and you can see what the shorter walk costs before taking it.
  const payoutPlan = computeCrewPlan(pool, state.playerCount, state.buyerRequests, false);
  const fastestPlan = crew ? computeCrewPlan(pool, state.playerCount, state.buyerRequests, true) : payoutPlan;
  const mode = state.resultMode === 'fastest' ? 'fastest' : 'payout';
  const { players, bonusActive, totalValue } = mode === 'fastest' ? fastestPlan : payoutPlan;
  let html = '';

  // Solo has no areas to divide, so both modes are the same plan and the choice is noise.
  if (crew) {
    const btn = (id, name, sub, plan) => `<button class="mode${id === 'fastest' ? ' right' : ''}${mode === id ? ' active' : ''}" data-act="mode" data-mode="${id}">
      <span class="mode-name">${name}</span>
      <span class="mode-val">$${fmtK(plan.totalValue)}k</span>
      <span class="mode-sub">${sub}</span></button>`;
    html += `<div class="modes">
      ${btn('payout', 'Highest payout', 'best loot anywhere', payoutPlan)}
      ${btn('fastest', 'Fastest', 'stay in your own area', fastestPlan)}</div>`;
  }

  if (openedFromShare) {
    html += `<div class="note-box">Someone shared this plan with you. It's yours to edit now - change anything and it saves to this device.</div>`;
  }

  const notices = planNotices(players);
  if (notices.length) {
    html += `<div class="warn-box"><div class="warn-title">Before these open</div>
      ${notices.map(w => `<div class="warn-item${w.orphan ? ' orphan' : ''}">
        <div class="warn-line">${esc(w.line)}</div>
        <div class="warn-foot">${esc(w.foot)}</div></div>`).join('')}</div>`;
  }

  if (crew) {
    const shortfall = payoutPlan.totalValue - fastestPlan.totalValue;
    html += `<div class="note-box">${mode === 'fastest'
      ? `Each player works one floor and takes anything on it, in any order that suits - the areas below only set the walking order, they don't ration who gets what. Crossing to another floor happens only once a player's own floor can't fill their bag${shortfall > 0 ? `, which is what costs $${fmtK(shortfall)}k against the highest-payout plan` : ''}.`
      : `Every player takes the richest loot left anywhere in the building, so the bags are worth as much as they can be. Nobody is held to a floor, so expect crossing paths and backtracking${shortfall > 0 ? ` - the Fastest plan gives up $${fmtK(shortfall)}k to avoid it` : ''}.`
    } Crisp Gallery needs someone to hold the door: that player gets none of its loot, chosen automatically for the best total.</div>`;
  }
  if (players && payoutPlan.dropped) {
    const why = {
      unreachable: `${payoutPlan.unreachable} of them ${payoutPlan.unreachable === 1 ? 'is' : 'are'} in the Crisp Gallery, which needs 2+ players`,
      incomplete: `only ${payoutPlan.selectedCount} of 3 ${payoutPlan.selectedCount === 1 ? 'is' : 'are'} selected`,
      nofit: `all three are here, but no arrangement of bags carries them all`,
    }[payoutPlan.dropped];
    html += `<div class="warn-box"><div class="warn-title">Buyer's Requests dropped</div>
      <div class="warn-item"><div class="warn-line">The $50k bonus needs all three and ${esc(why)} — so it can't be earned.</div>
      <div class="warn-foot">Two out of three pays the same as none, so the plan ignores them and goes for maximum cash instead.</div></div></div>`;
  } else {
    html += `<div class="hint">${state.buyerRequests.length}/3 Buyer's Requests selected (marked with * below) - auto-fulfilled by whichever player has room</div>`;
  }
  html += `<div class="hint">Picks maximize cash, not item count or headline price - bag space is the real currency. Paintings look big but cost 50% of a bag, so they lose to smaller loot with a higher per-1% return (shown under each row).</div>`;

  players.forEach(p => {
    // Ordered as a walking route: cluster in run order, then spot order within the cluster - which
    // is the order you physically pass them, so the list reads top to bottom as you move.
    const rows = [
      ...p.lockedItems.map(it => ({ ...it, isLocked: true })),
      ...p.fillItems.map(it => ({ ...it, isLocked: false })),
    ].sort((a, b) => {
      if (a.locationOrder !== b.locationOrder) return a.locationOrder - b.locationOrder;
      if (a.spot !== b.spot) return a.spot - b.spot;
      return b.value - a.value;
    });
    // The floor is the assignment, so the floor is what gets named. Only shown on the Fastest plan:
    // under Highest payout nothing holds a player to a floor, so naming one would be a fiction.
    const patchLabel = mode === 'fastest' && crew && p.floorId ? FLOOR_LABEL[p.floorId] : '';
    // Joined with a middot, not a dash - the cluster labels contain dashes of their own.
    const hackerNote = p.isHacker ? 'Crisp Gallery Hacker, no Crisp loot' : '';
    const subLine = [patchLabel, hackerNote].filter(Boolean).join(' · ');

    // The name is an input rather than a heading so a gamertag can go straight in. It feeds nothing
    // but the label, so typing writes state without re-rendering - a re-render would steal focus.
    html += `<div class="card">
      <div class="p-head">
        <input class="p-name" data-act="pname" data-num="${p.num}" value="${esc(state.playerNames[p.num] || '')}"
          placeholder="Player ${p.num}" aria-label="Name for player ${p.num}" enterkeyhint="done" maxlength="24"/>
        <div class="p-meta">${p.pctUsed}% used - ${100 - p.pctUsed}% left</div></div>`;
    if (subLine) html += `<div class="p-sub">${esc(subLine)}</div>`;
    html += `<div class="bar"><div class="bar-fill" style="width:${Math.min(100, p.pctUsed)}%"></div></div>
      <div style="display:flex;flex-direction:column">`;
    if (rows.length) {
      rows.forEach(it => {
        const color = it.isLocked ? '#d2cefd' : 'var(--text)';
        const picked = !!state.pickedUp[it.id];
        html += `<label class="res-row${picked ? ' picked' : ''}">
          <input type="checkbox" data-act="picked" data-id="${esc(it.id)}" ${picked ? 'checked' : ''}/>
          <span class="res-body">
            <span class="res-line" style="color:${color}">
              <span>${esc(it.categoryLabel)}${it.isLocked ? ' *' : ''}</span>
              <span style="font-variant-numeric:tabular-nums">$${fmtK(it.value)}k - ${it.pct}%</span></span>
            <span class="res-sub">${esc(it.locationLabel)} &middot; ${esc(it.lootType)} &middot; $${fmtK(Math.round(it.value / it.pct))}k per 1% bag</span>
          </span></label>`;
      });
    } else {
      html += `<div class="empty-msg">Enter scouted items on the Loot Available tab to see a suggested fill.</div>`;
    }
    html += `</div><div class="bag-total"><span class="bag-total-label">Bag total</span>
      <span class="bag-total-val">$${fmtK(p.value)}k</span></div></div>`;
  });

  if (bonusActive) {
    html += `<div class="bonus-box">All 3 Buyer's Requests fulfilled - +$50k bonus payout included below</div>`;
  }
  html += `<div class="grand"><span class="grand-label">Total payout</span>
    <span class="grand-val">$${fmtK(totalValue)}k</span></div>`;
  html += `<button class="share-btn" data-act="share">Share this plan</button>
    <div class="hint" id="shareHint">Sends a link holding this whole scouted run - names, values and both plans. Opening it replaces whatever is saved on that device.</div>`;
  return html;
}

// Native share sheet where there is one (that's the phone case, and the point of the feature),
// clipboard everywhere else, and a selectable box if the browser refuses both.
async function sharePlan(btn) {
  const url = shareUrl();
  if (navigator.share) {
    try { await navigator.share({ title: 'Kortz Center loot plan', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = 'Link copied';
    setTimeout(() => { btn.textContent = 'Share this plan'; }, 2000);
  } catch (e) {
    const hint = document.getElementById('shareHint');
    if (hint) {
      hint.innerHTML = `<input class="share-url" readonly value="${esc(url)}" aria-label="Shareable link"/>`;
      const field = hint.querySelector('.share-url');
      field.focus(); field.select();
    }
  }
}

/* ---------------- Event wiring ---------------- */
function updatePoolTotalLive() {
  const pool = buildPool();
  const total = pool.reduce((s, it) => s + it.value, 0);
  const hint = bodyEl.querySelector('.hint');
  if (hint) hint.textContent = `${pool.length} items in play - $${fmtK(total)}k total pool value`;
}

function syncValueLabel(id, v) {
  const lab = bodyEl.querySelector(`.val-input[data-valfor="${CSS.escape(id)}"]`);
  if (lab) lab.value = fmtK(v);
}

// Accepts either how you'd read it off the screen ("41.5") or the full figure ("41500"), then
// clamps and snaps to the item's real increment so a typo can't produce an impossible value.
function commitTypedValue(el) {
  const id = el.dataset.id;
  const range = bodyEl.querySelector(`input[type=range][data-id="${CSS.escape(id)}"]`);
  if (!range) return;
  const min = parseFloat(range.min), max = parseFloat(range.max), step = parseFloat(range.step) || 1;
  let n = parseFloat(String(el.value).replace(/[^0-9.]/g, ''));
  if (!isFinite(n)) { el.value = fmtK(parseFloat(range.value)); return; }
  if (n < 1000) n *= 1000;
  n = Math.min(max, Math.max(min, min + Math.round((n - min) / step) * step));
  range.value = n;
  range.dispatchEvent(new Event('input', { bubbles: true }));
  el.value = fmtK(n);
}

function attachListeners() {
  bodyEl.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;
    const id = el.dataset.id;
    if (act === 'collapse') el.addEventListener('click', () => toggleCollapse(id));
    else if (act === 'skip') el.addEventListener('click', () => toggleSkip(id));
    else if (act === 'empty') el.addEventListener('click', () => toggleEmpty(id));
    else if (act === 'item') el.addEventListener('change', e => setItemKey(id, el.dataset.cat, e.target.value));
    else if (act === 'buyer') el.addEventListener('click', () => toggleBuyerRequest(id));
    else if (act === 'picked') el.addEventListener('change', () => togglePickedUp(id));
    else if (act === 'scoped') el.addEventListener('change', () => toggleScoped(id));
    else if (act === 'clear-scoped') el.addEventListener('click', clearScoped);
    else if (act === 'mode') el.addEventListener('click', () => setResultMode(el.dataset.mode));
    else if (act === 'pname') {
      el.addEventListener('input', () => setPlayerName(el.dataset.num, el.value));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    }
    else if (act === 'share') el.addEventListener('click', () => sharePlan(el));
    else if (act === 'step') el.addEventListener('click', () => stepSlider(el.dataset.target, parseInt(el.dataset.dir, 10)));
    else if (act === 'add-deposit') el.addEventListener('click', addDepositBox);
    else if (act === 'remove-deposit') el.addEventListener('click', () => removeDepositBox(parseInt(el.dataset.idx, 10)));
    else if (act === 'val') {
      el.addEventListener('focus', () => el.select());
      el.addEventListener('change', () => commitTypedValue(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    }
    else if (act === 'slide') {
      el.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        setValue(id, v);
        syncValueLabel(id, v);
        updatePoolTotalLive();
      });
    } else if (act === 'deposit-slide') {
      el.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        setDepositBoxValue(parseInt(el.dataset.idx, 10), v);
        syncValueLabel(id, v);
        updatePoolTotalLive();
      });
    }
  });
}

document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('playerSelect').addEventListener('change', e => setPlayerCount(parseInt(e.target.value, 10)));
document.getElementById('tabItems').addEventListener('click', () => setTab('items'));
document.getElementById('tabResults').addEventListener('click', () => setTab('results'));

loadState();
// A link wins over whatever this device had saved - opening one is asking to see that plan.
if (applySharedPlan()) { openedFromShare = true; state.tab = 'results'; saveState(); }
render();

// Opening a second link while the page is already up only changes the fragment, which the browser
// treats as same-document - nothing reloads, so the plan would otherwise never be picked up.
window.addEventListener('hashchange', () => {
  if (applySharedPlan()) { openedFromShare = true; state.tab = 'results'; saveState(); render(); }
});
</script>
</body>
</html>
